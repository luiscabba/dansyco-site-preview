<title>Tugboat | Dansyco Shipyard</title>

<style>
body{margin:0}
</style>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#12185C}a:hover{color:#0B0E24}
.pt-drop{animation:shDrop .62s cubic-bezier(.22,1.5,.42,1) both}
@keyframes shDrop{0%{opacity:0;transform:translateY(-90px)}55%{opacity:1}100%{opacity:1;transform:translateY(0)}}
@keyframes shInk{0%{fill-opacity:0}60%{fill-opacity:0}100%{stroke-dashoffset:0;fill-opacity:1}}
.pt-pop{animation:shPop .55s cubic-bezier(.3,1.7,.5,1) both}
@keyframes shPop{0%{transform:scale(0)}100%{transform:scale(1)}}
.pt-rise{animation:shRise .9s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes shRise{0%{opacity:0;transform:translateY(80px)}40%{opacity:1}100%{opacity:1;transform:translateY(0)}}
.pt-crane{animation:shCrane 1.1s cubic-bezier(.35,0,.2,1) both}
@keyframes shCrane{0%{transform:translateY(-340px)}100%{transform:translateY(0)}}
.hook{animation:shHook 1.4s linear both}
@keyframes shHook{0%{opacity:1}78%{opacity:1}100%{opacity:0}}
.spk{animation:shSpark .6s ease-out both}
@keyframes shSpark{0%{opacity:0;transform:scale(.2)}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.8)}}
.pt-flick{animation:shFlick .8s linear both}
@keyframes shFlick{0%{opacity:0}18%{opacity:.85}26%{opacity:.1}40%{opacity:1}52%{opacity:.3}66%{opacity:1}100%{opacity:1}}
.gh{animation:shDraw .9s ease-out both}
@keyframes shDraw{to{stroke-dashoffset:0}}
.mz{animation:shDraw .7s ease-out both}
.ghwrap{animation:shGhost 5.5s ease both}
@keyframes shGhost{0%{opacity:1}60%{opacity:1}100%{opacity:.25}}
.chip{animation:shChip .4s ease both}
@keyframes shChip{0%{opacity:.3}100%{opacity:1}}
.late{animation:shFade .6s ease both}
@keyframes shFade{0%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion: reduce){.pt-drop,.pt-pop,.pt-rise,.pt-crane,.pt-flick,.late,.chip,.gh,.ghwrap,.mz{animation:none}.hook,.spk{display:none}}
::selection{background:#12185C;color:#FFFFFF}
a:focus-visible,button:focus-visible{outline:2px solid #D7372F;outline-offset:3px}
.geo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.arr{display:inline-block;transition:transform .35s cubic-bezier(.16,1,.3,1)}
.btn-red{transition:background-color .25s cubic-bezier(.16,1,.3,1)}
.btn-red:hover{background-color:#B82A23 !important}
.btn-red:hover .arr,.btn-w:hover .arr,.btn-line:hover .arr,.v2-fleet:hover .arr{transform:translateX(5px)}
.btn-w{transition:box-shadow .3s cubic-bezier(.16,1,.3,1)}
.btn-w:hover{box-shadow:0 10px 24px rgba(0,0,0,.28)}
.btn-line{transition:background-color .25s}
.btn-line:hover{background-color:#EEF0F4}
.v2-fleet{transition:border-color .25s,box-shadow .35s cubic-bezier(.16,1,.3,1),transform .35s cubic-bezier(.16,1,.3,1)}
.v2-fleet:hover{border-color:#12185C !important;box-shadow:0 14px 30px rgba(18,24,92,.14);transform:translateY(-3px)}
.v2-fleet .ph img,.zoom img{transition:transform .7s cubic-bezier(.16,1,.3,1)}
.v2-fleet:hover .ph img,.zoom:hover img{transform:scale(1.05)}
.v2-fleet .go{transition:background-color .25s,color .25s}
.v2-fleet:hover .go{background:#D7372F;color:#FFFFFF}
.zoom{overflow:hidden}
.step svg{transition:transform .4s cubic-bezier(.16,1,.3,1)}
.step:hover svg{transform:translateY(-4px)}
.tab{transition:background-color .2s,transform .35s cubic-bezier(.16,1,.3,1)}
.tab:hover{transform:translateX(4px)}
.js-rv .rv{transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1),box-shadow .35s,border-color .25s}
.js-rv .rv:not(.in){opacity:.15;transform:translateY(26px)}
.js-rv .rv-img{transition:clip-path 1.1s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1)}
.js-rv .rv-img:not(.in){clip-path:inset(22% 0 0 0)}
.js-rv .rv-d1{transition-delay:.08s}.js-rv .rv-d2{transition-delay:.16s}.js-rv .rv-d3{transition-delay:.24s}.js-rv .rv-d4{transition-delay:.32s}.js-rv .rv-d5{transition-delay:.4s}
.js-rv .done{transition-delay:0s !important}
@media (prefers-reduced-motion: reduce){.js-rv .rv,.js-rv .rv-img{transition:none}}
.vcard{transition:border-color .25s,box-shadow .35s cubic-bezier(.16,1,.3,1),transform .35s cubic-bezier(.16,1,.3,1)}
.vcard:hover{border-color:#12185C !important;box-shadow:0 14px 30px rgba(18,24,92,.14);transform:translateY(-3px)}
.vcard .ph img{transition:transform .7s cubic-bezier(.16,1,.3,1)}
.vcard:hover .ph img{transform:scale(1.05)}
.vcard .go{transition:background-color .25s,color .25s}
.vcard:hover .go{background:#D7372F;color:#FFFFFF}
.vcard:hover .arr{transform:translateX(5px)}
.stepc{transition:transform .35s cubic-bezier(.16,1,.3,1),box-shadow .35s cubic-bezier(.16,1,.3,1)}
.stepc:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(18,24,92,.12)}
.crumb a{transition:color .2s}.crumb a:hover{color:#D7372F}
@media (prefers-reduced-motion: reduce){.vcard,.vcard .ph img,.stepc{transition:none}.vcard:hover,.stepc:hover{transform:none}}

</style>
